
<header class="site-header">
    <div class="container header-content">
        <a
            class="brand"
            href="{% url 'core:home' %}"
            aria-label="MinimalStore, ir al inicio"
        >
            <span>Minimal</span><span class="brand-accent">Store</span>
        </a>

        <p class="header-tagline">
            Diseño esencial. Vida cotidiana.
        </p>

        <div class="account-links">
            {% if user.is_authenticated %}
                <span class="account-greeting">
                    Hola, {{ user.username }}
                </span>

                <form
                    class="logout-form"
                    method="post"
                    action="{% url 'accounts:logout' %}"
                >
                    {% csrf_token %}
                    <button class="account-action" type="submit">
                        Cerrar sesión
                    </button>
                </form>
            {% else %}
                <a
                    class="account-action"
                    href="{% url 'accounts:login' %}"
                >
                    Iniciar sesión
                </a>

                <a
                    class="account-register"
                    href="{% url 'accounts:register' %}"
                >
                    Crear cuenta
                    <span aria-hidden="true">↗</span>
                </a>
            {% endif %}
        </div>
    </div>
</header>
